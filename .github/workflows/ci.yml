name: proofs

# The determinism and collapse properties are the whole claim, so they are checked on
# every push rather than asserted in a README. Everything here runs offline against the
# in-memory reference backend — no cloud credentials, no model spend — which is exactly
# why the kernel was kept free of both.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        # Firestore tests skip themselves without GOOGLE_CLOUD_PROJECT, so the suite is
        # green offline and gains two more assertions when run against a real project.
        run: python -m pytest tests/ -q

      - name: Determinism proof
        # Records a fleet, replays it, and fails if the replay reaches the model even
        # once or reproduces a different causal root hash.
        run: python scripts/verify_determinism.py

      - name: Ablation
        # Answers "is this just a GROUP BY" with numbers rather than a paragraph, and
        # fails if content addressing is not cheaper than regrouping across runs.
        run: python scripts/ablation.py

      - name: Concurrency invariance
        # A saving that only holds when nobody is in a hurry is not a saving. Asserts the
        # same population costs the same at concurrency 1 and 48.
        run: python scripts/verify_concurrency.py

      - name: Baselines
        # Every arm that can run, runs, and all of them are printed. There is no flag to
        # hide a losing one — B2 (hand-written rules, no model) beat an earlier version of
        # this project and is in the default output.
        run: python -m bench.run --agents 4000

      - name: Collapse proof
        # Asserts distinct situations stay bounded while population grows — the
        # saturation property, checked without spending a token.
        run: python scripts/verify_collapse.py

      - name: Containment proof
        # Collapse amplifies an injection by the collapse ratio, so the airlock is
        # load-bearing rather than hygiene. Fails if a single attacker-controlled byte
        # can reach a shared prompt, if an attacker can mint or steer a shared address,
        # or if the screen starts blocking real travellers.
        run: python scripts/verify_armor.py

      - name: Memory
        # Memory is the feature most likely to quietly destroy this product: per-traveller
        # history in a prompt makes every address unique and collapse 1x. Fails if
        # remembering costs more than a tenth of the saving, if a constraint outlives its
        # TTL, or if a single identifying string reaches a prompt.
        run: python scripts/verify_memory.py

      - name: Extraction, keyword arm
        # The zero-model control. Its score is the bar the model has to clear for the
        # extraction stage to be worth paying for at all.
        run: python scripts/verify_extraction.py

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --prefix console --no-audit --no-fund
      - name: Typecheck
        run: npx --prefix console tsc -b --noEmit
        working-directory: console
      - name: Build
        run: npm run build --prefix console
